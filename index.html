<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UFO Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Honk:MORF,SHLN@0..45,0..100&family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Honk:MORF,SHLN@0..45,0..100&family=Orbitron:wght@400..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            height: 100vh;
            background-image:
                radial-gradient(circle at 0% 100%, #C7158555 5%, rgba(0, 0, 0, 0) 50%),
                radial-gradient(circle at 0% 0%, #48D1CC55 5%, rgba(0, 0, 0, 0) 50%),
                radial-gradient(circle at 100% 100%, #FF149333 5%, rgba(0, 0, 0, 0) 50%),
                linear-gradient(black, indigo);
            overflow: hidden;
            font-family: 'Honk', cursive;
            touch-action: none;
        }

        .space,
        .planets,
        .shootingstar {
            position: absolute;
            top: 0;
            left: 0;
        }

        .space {
            z-index: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        .planets {

            width: 100vw;
            height: 100vh;
            filter: brightness(0.27);

        .info {
            color: #fff;
            font-size: clamp(14px, 3.5vw, 42px);
            z-index: 33;
            font-family: 'Honk', cursive;
            transition: opacity 3s;
            position: fixed;
            bottom: clamp(10px, 3vh, 30px);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 800px) {
            .info {
                font-size: 12px;
                bottom: 12px;
                white-space: normal;
                padding: 0 20px;
            }
        }

        @media (max-width: 500px) {
            .info {
                font-size: 9px;
                bottom: 8px;
                padding: 0 10px;
            }
        }

        @media (pointer: coarse) {
            .info {
                font-size: 12px;
            }
        }

</head>
<body>

    <canvas class="space"></canvas>
    <canvas class="shootingstar"></canvas>
    <canvas class="planets"></canvas>

    <div class="ufo"></div>
    <div class="info">👽 touch or move mouse to control UFO</div>

    <script>
        // ===== SPACE CANVAS =====
        let space = document.querySelector('.space');
        let planets = document.querySelector('.planets');
        let ctx = space.getContext('2d');
        let ctxPlanets = planets.getContext('2d');

        function setCanvasDimensions() {
            space.width = window.innerWidth;
            space.height = window.innerHeight;
            planets.width = window.innerWidth;
            planets.height = window.innerHeight;

            drawSpace();
            drawPlanets();
        }

        function drawSpace() {
            ctx.clearRect(0, 0, space.width, space.height);
            const w = space.width;
            const h = space.height;

            for (let i = 0; i < 2500; i++) {
                let randomX = Math.random() * w;
                let randomY = Math.random() * h;
                let size = Math.random() < 0.7 ? 0.5 : 1.5;
                let r = Math.floor(Math.random() * 155) + 100;
                let g = Math.floor(Math.random() * 155) + 100;
                let b = Math.floor(Math.random() * 155) + 100;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(randomX, randomY, size, size);
            }
        }

        function drawPlanets() {
            ctxPlanets.clearRect(0, 0, planets.width, planets.height);

            let planetsArray = [];
            const w = planets.width;
            const h = planets.height;

            for (let j = 0; j < 9; j++) {
                let x, y, radius;
                let overlaps;
                let attempts = 0;
                const maxAttempts = 1000;

                do {
                    radius = Math.random() * 20 + 10;
                    x = Math.random() * (w - 2 * radius) + radius;
                    y = Math.random() * (h - 2 * radius) + radius;

                    overlaps = false;
                    for (let i = 0; i < planetsArray.length; i++) {
                        let other = planetsArray[i];
                        let dx = x - other.x;
                        let dy = y - other.y;
                        let distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < radius + other.radius) {
                            overlaps = true;
                            break;
                        }
                    }
                    attempts++;
                    if (attempts > maxAttempts) break;
                } while (overlaps);

                planetsArray.push({ x, y, radius });

                let hue = Math.random() * 260;
                let grad = ctxPlanets.createRadialGradient(x + 15, y + 15, 5, x + 15, y + 15, radius);
                grad.addColorStop(0, `hsl(${hue}, 100%, 40%)`);
                grad.addColorStop(1, `hsl(${hue}, 100%, 20%)`);

                ctxPlanets.fillStyle = grad;
                ctxPlanets.beginPath();
                ctxPlanets.arc(x, y, radius, 0, Math.PI * 2);
                ctxPlanets.fill();
            }
        }

        setCanvasDimensions();
        window.addEventListener('resize', setCanvasDimensions);

        // ===== MOUSE PARALLAX =====
        let info = document.querySelector('.info');

        function handlePointerMove(clientX, clientY) {
            info.style.opacity = '0';

            const moveXSpace = (clientX - window.innerWidth / 2) * -0.01;
            const moveYSpace = (clientY - window.innerHeight / 2) * -0.01;

            const moveXPlanets = (clientX - window.innerWidth / 2) * -0.0185;
            const moveYPlanets = (clientY - window.innerHeight / 2) * -0.0185;

            space.style.transform = `translate(${moveXSpace}px, ${moveYSpace}px)`;
            planets.style.transform = `translate(${moveXPlanets}px, ${moveYPlanets}px)`;

            // UFO follow
            targetX = clientX;
            targetY = clientY;
        }

        // ===== UFO FOLLOW =====
        const ufo = document.querySelector('.ufo');
        let targetX = -200;
        let targetY = -200;
        let currentX = -200;
        let currentY = -200;
        let floatOffset = 0;

        // Mouse
        document.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });

        // Touch
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (touch) {
                handlePointerMove(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (touch) {
                handlePointerMove(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            // Не сбрасываем позицию, чтобы тарелка оставалась на месте
        }, { passive: true });

        function animateUFO() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;
            floatOffset = Math.sin(Date.now() * 0.005) * 5;
            ufo.style.left = currentX + 'px';
            ufo.style.top = (currentY + floatOffset) + 'px';
            requestAnimationFrame(animateUFO);
        }
        animateUFO();

        // ===== SHOOTING STARS =====
        const shootingStar = document.querySelector('.shootingstar');
        const starCtx = shootingStar.getContext('2d');
        shootingStar.width = window.innerWidth;
        shootingStar.height = window.innerHeight;

        let pixels = [];
        const angleRad = 170 * (Math.PI / 180);

        for (let k = 0; k < 35; k++) {
            let rX = Math.floor(Math.random() * shootingStar.width);
            let rY = Math.floor(Math.random() * shootingStar.height);
            let size = 0.85;
            let r = Math.floor(Math.random() * 155) + 100;
            let g = Math.floor(Math.random() * 155) + 100;
            let b = Math.floor(Math.random() * 155) + 100;
            let speed = Math.random() * 2 + 3;
            let delay = Math.random() * 100;

            pixels.push({
                x: rX,
                y: rY,
                size: size,
                color: `rgb(${r},${g},${b})`,
                speedX: Math.cos(angleRad) * speed,
                speedY: Math.sin(angleRad) * speed,
                delay: delay
            });
        }

        function animatePixels() {
            starCtx.clearRect(0, 0, shootingStar.width, shootingStar.height);

            pixels.forEach(p => {
                if (p.delay > 0) {
                    p.delay--;
                } else {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0) p.x = shootingStar.width;
                    if (p.y > shootingStar.height) p.y = 0;
                }
                starCtx.fillStyle = p.color;
                starCtx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
            });

            requestAnimationFrame(animatePixels);
        }
        animatePixels();

        // Resize shooting star canvas
        window.addEventListener('resize', () => {
            shootingStar.width = window.innerWidth;
            shootingStar.height = window.innerHeight;
        });
    </script>

</body>
</html>
